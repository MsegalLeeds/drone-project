<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="Drone wiring diagram, 03-bench-and-checks"><rect x="0" y="0" width="1200" height="850" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="40" y="44" fill="#17283A" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Drone wiring | Buzzer, bench equipment and checks</text><text x="40" y="70" fill="#516273" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">The transistor circuit is an added part. Ground equipment disconnects before flight.</text><text x="1160" y="42" fill="#516273" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="end">3 / 3</text><polyline points="40,88 1160,88" fill="none" stroke="#CCD5DD" stroke-width="1"/><rect x="40" y="112" width="540" height="267" rx="7" fill="#F2F6F9" stroke="#CCD5DD"/><text x="56" y="139" fill="#17283A" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Add a low-side buzzer driver</text><text x="56" y="161" fill="#17283A" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Example: 2N3904 NPN + 1 kohm + 100 kohm resistors</text><rect x="335" y="211" width="95" height="84" rx="7" fill="#FFFFFF" stroke="#CCD5DD"/><text x="382" y="234" fill="#17283A" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">2N3904</text><text x="347" y="258" fill="#17283A" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">B</text><text x="408" y="224" fill="#17283A" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">C</text><text x="408" y="287" fill="#17283A" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">E</text><text x="56" y="250" fill="#17283A" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">BUZZER_GPIO</text><polyline points="148,246 183,246" fill="none" stroke="#246AB0" stroke-width="1.7"/><rect x="183" y="236" width="58" height="20" rx="1" fill="#FFFFFF" stroke="#CCD5DD"/><text x="212" y="250" fill="#17283A" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">1 kohm</text><polyline points="241,246 335,246" fill="none" stroke="#246AB0" stroke-width="1.7"/><circle cx="282" cy="246" r="3" fill="#246AB0" stroke="#246AB0" stroke-width="1"/><polyline points="282,246 282,278" fill="none" stroke="#246AB0" stroke-width="1.5"/><rect x="270" y="278" width="24" height="40" rx="1" fill="#FFFFFF" stroke="#CCD5DD"/><text x="244" y="295" fill="#17283A" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="end">100</text><text x="244" y="309" fill="#17283A" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="end">kohm</text><polyline points="282,318 282,337 414,337 414,295" fill="none" stroke="#4D5661" stroke-width="1.7"/><text x="345" y="354" fill="#4D5661" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">GND</text><polyline points="414,211 414,188 550,188" fill="none" stroke="#246AB0" stroke-width="1.7"/><text x="444" y="181" fill="#246AB0" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Yellow / BZ</text><text x="444" y="221" fill="#BD6200" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Red -&gt; +5 V</text><text x="444" y="242" fill="#4D5661" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Black -&gt; GND</text><text x="56" y="354" fill="#516273" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">GPIO high pulls BZ low. Confirm the transistor pin order</text><text x="56" y="367" fill="#516273" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">for its package.</text><rect x="604" y="112" width="556" height="267" rx="7" fill="#FFFFFF" stroke="#CCD5DD"/><text x="620" y="139" fill="#17283A" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Off-drone connections</text><text x="620" y="170" fill="#17283A" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">ST-Link V2 compatible</text><text x="620" y="187" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">SWDIO -&gt; core SWDIO; SWCLK -&gt; SWCLK; GND -&gt; GND. NRST if available. A true VTref input senses target</text><text x="620" y="201" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">3.3 V; a clone 3.3 V power output stays disconnected.</text><text x="620" y="230" fill="#17283A" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Pocket + two 18650 cells</text><text x="620" y="247" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Install cells in the transmitter with the marked polarity. Pocket ELRS 2.4 GHz links wirelessly to RP1; there is no</text><text x="620" y="261" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">cable to the drone.</text><text x="620" y="290" fill="#17283A" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">HTRC B3 charger</text><text x="620" y="307" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">With LiPo disconnected from drone: 3S balance lead -&gt; charger 3S socket, per its manual. Main XT60 stays</text><text x="620" y="321" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">disconnected; do not use a 2S socket.</text><polyline points="40,398 1160,398" fill="none" stroke="#CCD5DD" stroke-width="1.4"/><text x="40" y="425" fill="#17283A" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Resolve before soldering or applying power</text><text x="40" y="455" fill="#17283A" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">STM32 board and firmware</text><text x="40" y="473" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Confirm the board schematic, its 5 V input and 3.3 V rail. Assign two SPI buses, two I2C buses, two UARTs, four</text><text x="40" y="487" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">timer outputs, two ADC inputs, IMU interrupt and buzzer GPIO. Reserve SWD pins. Stock flight firmware is not</text><text x="40" y="501" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">guaranteed to support this core board or these sensors.</text><text x="620" y="455" fill="#17283A" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">ESC wiring and protocol</text><text x="620" y="473" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Each ESC: thick red -&gt; PDB BAT+; thick black -&gt; PDB BAT-; three phase wires -&gt; its motor. Signal + signal GND</text><text x="620" y="487" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">-&gt; controller. Remove and insulate every thin red 5 V BEC lead. Confirm 3.3 V signal compatibility. Use supported</text><text x="620" y="501" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">PWM; do not assume DShot.</text><text x="40" y="551" fill="#17283A" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Logic, rails and first power-up</text><text x="40" y="569" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Keep sensor / SD logic at 3.3 V. Check the Foxeer UART and I2C high levels; add level translation if required.</text><text x="40" y="583" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Check I2C pull-ups and avoid redundant low-value pull-ups. With props off, check polarity, shorts, 5 V and 3.3 V,</text><text x="40" y="597" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">then power through the smoke stopper. Avoid USB / debugger backfeeding.</text><text x="620" y="551" fill="#17283A" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Motor order and mechanical parts</text><text x="620" y="569" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Map ESC 1-4 to the motor positions used by your firmware. Verify rotation with props removed; swap any two</text><text x="620" y="583" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">phase wires with power off if needed. Fit matching props only after setup. Frame, mounts, strap, fixings and spare</text><text x="620" y="597" fill="#516273" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">props have no signal wiring. Keep the LiPo restrained and all cables clear of props.</text><rect x="40" y="654" width="1120" height="46" rx="4" fill="#FFF4D8" stroke="#FFF4D8"/><text x="52" y="672" fill="#17283A" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">The included 5045 three-blade props have no matched current test in the listing. Verify load current stays within each 12 A ESC rating. HCS-150A scale: I = Vcurr / 0.020; Vbattery = 21 x Vvolt. At a full 3S charge Vvolt is about 0.60 V.</text><text x="52" y="686" fill="#17283A" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Calibrate against measurements.</text><text x="40" y="724" fill="#17283A" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Source documents and product references</text><text x="40" y="748" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">SparkFun LSM6DSO hookup guide</text><text x="322" y="748" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Matek HCS-150A pin definitions</text><text x="604" y="748" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Waveshare BMP388 documentation</text><text x="886" y="748" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Pi Hut MicroSD breakout</text><text x="40" y="769" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Waveshare buck documentation</text><text x="322" y="769" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">RadioMaster RP1 specifications</text><text x="604" y="769" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">ExpressLRS receiver wiring</text><text x="886" y="769" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">VIFLY Finder Mini manual</text><text x="40" y="790" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Foxeer supplier specifications</text><text x="322" y="790" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Exact motor / ESC set supplied</text><text x="604" y="790" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">STM32 listing, schematic not verified</text><text x="886" y="790" fill="#246AB0" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">EMAX 12 A BLHeli product page</text><polyline points="40,812 1160,812" fill="none" stroke="#CCD5DD" stroke-width="1.4"/><text x="40" y="833" fill="#516273" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Rev A | 17 October 2026 | Functional wiring plan. STM32 header positions and firmware mapping remain unverified.</text><text x="1160" y="833" fill="#516273" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="end">NC = leave disconnected and insulated</text></svg>